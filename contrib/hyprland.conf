# VoxClip keybindings and rules for Hyprland
# Add these lines to your ~/.config/hypr/hyprland.conf

# Toggle voice recording (start/stop)
bind = $mainMod SHIFT, V, exec, voxclip toggle

# Open transcription history
bind = $mainMod ALT, H, exec, voxclip history

# Layer rules for the VoxClip overlay HUD
layerrule = blur on, match:namespace ^(voxclip)$
layerrule = ignore_alpha 0.3, match:namespace ^(voxclip)$

# Window rules for Settings GUI
windowrule = float 1, match:title ^(VoxClip Settings)$
windowrule = center 1, match:title ^(VoxClip Settings)$

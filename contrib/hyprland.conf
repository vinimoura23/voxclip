# VoxClip keybindings for Hyprland
# Add these lines to your ~/.config/hypr/hyprland.conf

# Toggle voice recording (start/stop)
bind = $mainMod SHIFT, V, exec, python -m voxclip toggle

# Open transcription history
bind = $mainMod SHIFT, H, exec, python -m voxclip history

# Layer rules for the VoxClip overlay
layerrule = blur, voxclip
layerrule = ignorealpha 0.3, voxclip
